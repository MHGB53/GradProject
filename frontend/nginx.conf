server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Redirect bare root to the Login page (mirrors FastAPI's RedirectResponse)
    location = / {
        return 301 /html/Login.html;
    }

    # Serve static frontend assets: HTML pages, CSS, JS, and 3-D GLB models
    location / {
        try_files $uri $uri/ =404;
    }

    # Reverse-proxy: all /api/* requests go to the FastAPI backend service.
    # proxy_read_timeout is set to 300 s to match MODAL_TIMEOUT_SECONDS in .env.
    location /api/ {
        proxy_pass            http://backend:8000;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        client_max_body_size  50M;
    }

    # Reverse-proxy: user-uploaded files (profile pictures, community attachments)
    location /uploads/ {
        proxy_pass       http://backend:8000;
        proxy_set_header Host $host;
    }

    # Reverse-proxy: Swagger UI, ReDoc, OpenAPI schema, and health endpoint
    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        proxy_pass       http://backend:8000;
        proxy_set_header Host $host;
    }
}
